    <script>
        function validateForm() {
            let name = document.getElementById('name').value;
            let phone = document.getElementById('phone').value;
            let aadhaar = document.getElementById('aadhaar').value;
            let nationality = document.querySelector('input[name="nationality"]:checked');

            if (!/^[A-Za-z ]+$/.test(name)) {
                alert("Name should contain only alphabets.");
                return false;
            }

            if (!/^\d{10}$/.test(phone)) {
                alert("Mobile number must be exactly 10 digits.");
                return false;
            }

            if (nationality) {
                if (nationality.value === "Indian" && !/^\d{12}$/.test(aadhaar)) {
                    alert("Aadhar number must be exactly 12 digits for Indians.");
                    return false;
                } else if (nationality.value === "Foreigner" && !/^\d{8}$/.test(aadhaar)) {
                    alert("Passport number must be exactly 8 digits for Foreigners.");
                    return false;
                }
            }

            return true;
        }

        function toggleLabel() {
            let nationality = document.querySelector('input[name="nationality"]:checked').value;
            let label = document.getElementById("aadhaar-label");
            let aadhaarField = document.getElementById('aadhaar');

            if (nationality === "Indian") {
                label.textContent = "Aadhar Number";
                aadhaarField.placeholder = "Enter 12-digit Aadhar";
            } else {
                label.textContent = "Passport Number";
                aadhaarField.placeholder = "Enter 8-digit Passport Number";
            }
            aadhaarField.disabled = false;
        }

        function togglePassword() {
            let passwordField = document.getElementById('password');
            passwordField.type = passwordField.type === "password" ? "text" : "password";
        }
    </script>
